name: Lint Podspec

# main 브랜치로의 PR / push 시 podspec 유효성 검증 (배포 전 사전 체크)
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Lint podspec
        run: pod lib lint TJJupiterVMSDK.podspec --allow-warnings
