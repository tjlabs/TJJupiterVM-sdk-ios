name: Lint Podspec

# main 브랜치로의 PR / push 시 podspec 유효성 검증 (배포 전 사전 체크)
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected Xcode: $XCODE"
          sudo xcode-select -switch "$XCODE"

      - name: Lint podspec
        run: pod lib lint TJJupiterVMSDK.podspec --allow-warnings
